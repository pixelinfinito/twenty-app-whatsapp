name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The pinned version, read from one file rather than repeated here.
      #
      # CI runs against the version production runs (R-2, NFR-M2): a PR that
      # cannot break must not start failing because Twenty shipped upstream
      # this morning. `compat.yml` is what watches `latest`, weekly, where a
      # break is news rather than an interruption.
      - name: Read the pinned Twenty version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .twenty-version)" >> "$GITHUB_OUTPUT"

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@044fc2d38908f711f5f073c345b656e13b541b8b # main 2026-08-16
        with:
          twenty-version: ${{ steps.pin.outputs.version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # The typed client is generated from the spawned instance's schema.
      # The instance is fresh, so the app's own objects exist there only after
      # the app is applied — generating before that produces a schema without
      # them, and `schema-enums.test.ts` (which reads the generated file by
      # path) and every `client.query` result type fail for want of them.
      - name: Apply the app to the instance
        run: |
          yarn twenty remote:add --url "$TWENTY_API_URL" --api-key "$TWENTY_API_KEY"
          yarn twenty apply . --force
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      - name: Generate the API client
        run: yarn twenty dev:generate-client .
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Run integration tests
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}
