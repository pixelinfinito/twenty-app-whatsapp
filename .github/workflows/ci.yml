name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The pinned version, read from one file rather than repeated here.
      #
      # CI runs against the version production runs (R-2, NFR-M2): a PR that
      # cannot break must not start failing because Twenty shipped upstream
      # this morning. `compat.yml` is what watches `latest`, weekly, where a
      # break is news rather than an interruption.
      - name: Read the pinned Twenty version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .twenty-version)" >> "$GITHUB_OUTPUT"

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@c75ef7bfd0589219bd22e8f134df458af0af3445 # twenty/v2.54.0
        with:
          twenty-version: ${{ steps.pin.outputs.version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Run integration tests
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      - name: Typecheck generated workspace clients
        run: yarn typecheck
